name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Temporary phased gate:
      # - Lint runs and remains visible, but does not block merges/deploys yet.
      # - Test + build are blocking checks.
      # Re-enable strict lint blocking after lint debt is reduced.
      - name: Lint (non-blocking for now)
        continue-on-error: true
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
