name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Temporary phased gate:
      # - Lint runs and remains visible, but does not block merges/deploys yet.
      # - Test + build are blocking checks.
      # Re-enable strict lint blocking after lint debt is reduced.
      - name: Lint (non-blocking for now)
        continue-on-error: true
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    needs: validate
    # Set CI_* secrets (same values as Vercel public env) so the production bundle can boot in tests.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        env:
          CI: true
          VITE_SUPABASE_URL: ${{ secrets.CI_VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CI_VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.CI_VITE_STRIPE_PUBLISHABLE_KEY }}
        run: npm run test:e2e
