<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Owe It</title>
    <meta name="description" content="Owe It - Accountability and achievements app." />
    <meta name="author" content="Owe It" />
    <!-- Same bg as app (--background) so there is no white flash before React/CSS loads -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: hsl(220 20% 14%);
      }
      #root {
        min-height: 100%;
        background: hsl(220 20% 14%);
      }
    </style>
    <link rel="preload" as="image" href="/app-logo.svg?v=__DEPLOY_REF__" fetchpriority="high" />
    <!-- favicon.svg + PNGs: same mark as app loading screen (see scripts/build_app_logo.py) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=__DEPLOY_REF__" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=__DEPLOY_REF__" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=__DEPLOY_REF__" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=__DEPLOY_REF__" />

    <meta property="og:title" content="Owe It" />
    <meta property="og:description" content="Owe It - Accountability and achievements app." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/app-logo.svg?v=__DEPLOY_REF__" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@oweitapp" />
    <meta name="twitter:image" content="/app-logo.svg?v=__DEPLOY_REF__" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
