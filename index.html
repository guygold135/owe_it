<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Owe It</title>
    <meta name="description" content="Owe It - Accountability and achievements app." />
    <meta name="author" content="Owe It" />
    <!-- Same bg as app (--background) so there is no white flash before React/CSS loads -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: hsl(220 20% 14%);
      }
      #root {
        min-height: 100%;
        min-height: 100dvh;
        background: hsl(220 20% 14%);
      }
      /* Mirrors BootstrapLogoScreen — paints before JS so the logo + bar appear immediately. */
      #boot-splash {
        min-height: 100%;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      #boot-splash img {
        display: block;
        width: 9rem;
        height: 9rem;
        object-fit: cover;
        border-radius: 1.75rem;
        filter: drop-shadow(0 1px 1px rgb(0 0 0 / 0.08));
        user-select: none;
      }
      @media (min-width: 640px) {
        #boot-splash img {
          width: 11rem;
          height: 11rem;
          border-radius: 2.125rem;
        }
      }
      #boot-splash .loading-track {
        width: 9rem;
        height: 0.36rem;
        border-radius: 999px;
        background: hsl(220 10% 25% / 0.45);
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 0 0 1px hsl(220 15% 30% / 0.45);
      }
      #boot-splash .loading-bar {
        position: absolute;
        inset: 0;
        width: 46%;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          hsl(145 80% 55% / 0.2),
          hsl(145 80% 55% / 0.92) 45%,
          hsl(145 80% 55% / 0.35)
        );
        animation: loading-slide 1.35s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        will-change: transform;
      }
      #boot-splash .boot-loading-label {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: hsl(220 8% 55% / 0.6);
      }
      @keyframes loading-slide {
        from {
          transform: translate3d(-120%, 0, 0);
        }
        to {
          transform: translate3d(260%, 0, 0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .loading-bar {
          animation: none;
          width: 65%;
          transform: translateX(18%);
        }
      }
    </style>
    <link rel="preload" as="image" href="/app-logo.svg?v=__DEPLOY_REF__" fetchpriority="high" />
    <!-- favicon.svg + PNGs: same mark as app loading screen (see npm run icons:build) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=__DEPLOY_REF__" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=__DEPLOY_REF__" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=__DEPLOY_REF__" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=__DEPLOY_REF__" />

    <meta property="og:title" content="Owe It" />
    <meta property="og:description" content="Owe It - Accountability and achievements app." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/app-logo.svg?v=__DEPLOY_REF__" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@oweitapp" />
    <meta name="twitter:image" content="/app-logo.svg?v=__DEPLOY_REF__" />
  </head>

  <body>
    <div id="root">
      <div id="boot-splash" aria-busy="true" aria-live="polite">
        <img
          src="/app-logo.svg?v=__DEPLOY_REF__"
          alt=""
          aria-hidden="true"
          width="176"
          height="176"
          decoding="sync"
          fetchpriority="high"
        />
        <div class="loading-track" aria-hidden="true">
          <div class="loading-bar"></div>
        </div>
        <p class="boot-loading-label">Loading</p>
      </div>
    </div>
    <script>
      (function () {
        try {
          var key = 'oweit:pending-judge-accept';
          var param = 'judgeInviteRequestId';
          var uuidRe = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          function store(id) {
            if (id && uuidRe.test(id)) sessionStorage.setItem(key, id);
          }
          var search = new URLSearchParams(window.location.search);
          if (search.get(param)) {
            store(search.get(param));
            return;
          }
          var pathMatch = window.location.pathname.match(/\/judge-invite\/([^/]+)/i);
          if (pathMatch) {
            store(pathMatch[1]);
            return;
          }
          var hash = window.location.hash.replace(/^#/, '');
          if (hash.indexOf('?') >= 0) {
            var hashParams = new URLSearchParams(hash.slice(hash.indexOf('?') + 1));
            if (hashParams.get(param)) {
              store(hashParams.get(param));
              return;
            }
          }
          var hashPathMatch = hash.match(/^\/?judge-invite\/([^/?]+)/i);
          if (hashPathMatch) store(hashPathMatch[1]);
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
